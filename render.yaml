services:
  - type: web
    name: heartbeat-pipeline
    runtime: node
    plan: free
    rootDir: heartbeat-pipeline
    buildCommand: npm ci --workspace=@heartbeat/cloud --workspace=@heartbeat/core --include-workspace-root=false
    startCommand: npm --workspace @heartbeat/cloud start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: heartbeat
      - key: API_KEY
        sync: false
